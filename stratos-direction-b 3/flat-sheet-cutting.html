<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flat Sheet Cutting — Stratos Laser</title>
<meta name="description" content="High-accuracy laser cutting for intricate micro-components from thin, medical-grade sheet.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/stratos-logo-white.svg" type="image/svg+xml">
<style>
@font-face{font-family:'D-DIN';src:url('assets/fonts/D-DIN-PRO-400.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'D-DIN';src:url('assets/fonts/D-DIN-PRO-700.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
body{margin:0;background:#000}
a{color:#f0f0fa}a:hover{color:#ffffff}
::selection{background:#24a8f2;color:#000}
.b-root{font-family:'D-DIN',Arial,Verdana,sans-serif;color:#f0f0fa;background:#000;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.b-root *{box-sizing:border-box}
.b-root a:focus-visible,.b-root button:focus-visible{outline:2px solid #24a8f2;outline-offset:3px}
.skip{position:absolute;left:-9999px;top:12px;z-index:100;background:#f0f0fa;color:#000;padding:12px 16px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.skip:focus{left:60px}
.skip:hover{color:#000}

/* bar */
.bar{position:fixed;top:0;left:0;right:0;z-index:50;height:84px;display:flex;align-items:center;gap:56px;padding:0 60px;color:#f0f0fa;
  background:linear-gradient(rgba(0,0,0,.6) 0%,rgba(0,0,0,0) 100%);transition:transform .5s cubic-bezier(.16,1,.3,1),color .35s ease,background .35s ease}
.bar.hide{transform:translateY(-100%)}
.bar.light{color:#0a0a0b;background:linear-gradient(rgba(255,255,255,.7) 0%,rgba(255,255,255,0) 100%)}
.home{display:flex;align-items:center;min-height:44px;color:inherit;flex:none}
.home:hover{color:inherit}
.logo{display:block;height:19px;width:auto}
.links{display:flex;align-items:center;gap:30px;margin:0;padding:0;list-style:none}
.links>li{position:relative}
.nl{position:relative;display:flex;align-items:center;gap:7px;min-height:44px;padding:0;border:0;background:none;cursor:pointer;color:inherit;text-decoration:none;
  font:700 13px/1 'D-DIN',Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.bar a.nl:hover,.bar button.nl:hover{color:inherit}
.nl::after{content:"";position:absolute;left:0;right:0;bottom:9px;height:2px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.16,1,.3,1)}
.nl:hover::after,.nl:focus-visible::after,.dd-open>.nl::after{transform:scaleX(1)}
.chev{transition:transform .3s ease}
.dd-open .chev,.has-dd:hover .chev{transform:rotate(180deg)}
.dd{position:absolute;top:100%;left:-20px;min-width:230px;margin:0;padding:8px 0;list-style:none;background:#000;border:1px solid rgba(240,240,250,.14);
  opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .25s ease,transform .35s cubic-bezier(.16,1,.3,1),visibility 0s .35s}
.has-dd:hover .dd,.has-dd:focus-within .dd,.dd-open .dd{opacity:1;visibility:visible;transform:none;transition:opacity .25s ease,transform .35s cubic-bezier(.16,1,.3,1)}
.dd a{display:flex;align-items:center;min-height:44px;padding:0 20px;color:#f0f0fa;text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.dd a:hover{background:#f0f0fa;color:#000}
.menu-btn{display:none;margin-left:auto;width:44px;height:44px;align-items:center;justify-content:center;border:0;background:none;color:inherit;cursor:pointer;padding:0}

/* drawer */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);border:0;padding:0;cursor:pointer;width:100%}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:61;width:min(400px,100%);background:#000;color:#f0f0fa;padding:20px 40px 40px;overflow-y:auto;animation:dIn .45s cubic-bezier(.16,1,.3,1) both}
@keyframes dIn{from{transform:translateX(100%)}to{transform:none}}
.drawer .x{display:flex;margin:0 -10px 24px auto;width:44px;height:44px;align-items:center;justify-content:center;border:0;background:none;color:inherit;cursor:pointer}
.drawer ul{list-style:none;margin:0;padding:0}
.drawer li a{display:flex;align-items:center;min-height:52px;border-bottom:1px solid rgba(240,240,250,.14);color:#f0f0fa;text-decoration:none;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.drawer li.sub a{padding-left:18px;font-size:13px;min-height:46px;color:#c9c9d4}
.drawer .grp{margin-top:28px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#9a9aa6;padding-bottom:8px;border-bottom:1px solid rgba(240,240,250,.14)}

/* panels */
.panel{position:relative;overflow:hidden;min-height:620px;background:#000}
.panel .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* the photographs are shot centred; widening them pushes the subject right, clear of the copy */
.panel .bg-pattern,.panel .bg-proto{width:122%;left:0;right:auto}
.panel .bg-facility{width:130%;left:0;right:auto}
.hero .bg{left:auto;right:0;width:auto;aspect-ratio:1/1;max-width:none}
.shade{position:absolute;inset:0;pointer-events:none}
.dark .shade{background:linear-gradient(90deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,.5) 28%,rgba(0,0,0,0) 56%),linear-gradient(0deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 30%)}
.light{background:#f5f7fb;color:#0a0a0b}
.light .shade{background:linear-gradient(90deg,rgba(245,247,251,.92) 0%,rgba(245,247,251,.75) 28%,rgba(245,247,251,0) 52%)}
.copy{position:absolute;left:60px;top:50%;transform:translateY(-50%);max-width:620px;z-index:2}
.hero .copy{top:auto;bottom:clamp(96px,14vh,150px);transform:none;max-width:780px}
.head{margin:0;font-weight:700;text-transform:uppercase;font-size:48px;line-height:1.04;letter-spacing:.02em;text-wrap:balance}
.hero .head{font-size:60px;line-height:.98;letter-spacing:.01em}
.blurb{margin:18px 0 0;max-width:440px;font-size:17px;line-height:1.5;letter-spacing:.01em;color:rgba(240,240,250,.86)}
.light .blurb{color:#2b2b31}
.sx-btn{display:inline-flex;align-items:center;gap:14px;height:50px;margin-top:30px;padding:0 22px;border:1px solid rgba(240,240,250,.35);color:#f0f0fa;text-decoration:none;
  font-size:14px;letter-spacing:.08em;text-transform:uppercase;transition:background .35s cubic-bezier(.16,1,.3,1),color .35s,border-color .35s}
.sx-btn .arr{transition:transform .45s cubic-bezier(.16,1,.3,1)}
.sx-btn:hover{background:#f0f0fa;border-color:#f0f0fa;color:#000}
.sx-btn:hover .arr{transform:translateX(4px)}
.light .sx-btn{border-color:rgba(10,10,11,.4);color:#0a0a0b}
.light .sx-btn:hover{background:#0a0a0b;border-color:#0a0a0b;color:#f5f7fb}

/* the one entrance: the first frame settles into place */
.hero .bg{animation:heroImg 2.4s cubic-bezier(.16,1,.3,1) both}
.hero .copy{animation:heroCopy 1.4s cubic-bezier(.16,1,.3,1) .35s both}
@keyframes heroImg{from{opacity:0;transform:scale(1.07)}to{opacity:1;transform:none}}
@keyframes heroCopy{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

/* footer */
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px 40px;min-height:96px;padding:28px 60px;background:#000;
  font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#c9c9d4}
.foot a{color:#f0f0fa;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
.foot a:hover{text-decoration:underline;text-underline-offset:4px}

@media (max-width: 1240px){
.links{display:none}
.menu-btn{display:flex}
.bar{gap:24px}
}
@media (max-width: 760px){
.bar{height:68px;padding:0 24px}
.copy,.hero .copy{left:24px;right:24px;top:auto;bottom:72px;transform:none;max-width:none}
.head{font-size:34px;line-height:1.05}
.hero .head{font-size:40px}
.blurb{font-size:16px;margin-top:14px}
.sx-btn{margin-top:24px}
.hero .bg{left:0;right:0;top:12%;width:100%;height:auto}
.panel .bg-pattern,.panel .bg-proto,.panel .bg-facility{width:100%;left:0}
.bg-pattern{object-position:58% 50%}
.bg-proto{object-position:72% 50%}
.panel .bg-facility{height:76%;object-position:50% 40%}
.dark .shade{background:linear-gradient(0deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.55) 32%,rgba(0,0,0,0) 62%)}
.light .shade{background:linear-gradient(0deg,rgba(245,247,251,.96) 0%,rgba(245,247,251,.88) 40%,rgba(245,247,251,0) 64%)}
.drawer{padding:16px 24px 32px}
.foot{padding:28px 24px;gap:4px 28px}
}
@media (prefers-reduced-motion: reduce){
.hero .bg,.hero .copy,.drawer{animation:none}
.bar,.nl::after,.sx-btn,.sx-btn .arr,.dd{transition:none}
}

/* ---- sub-page blocks ---- */
.nl[aria-current="page"]::after,.is-cur>.nl::after{transform:scaleX(1)}
.pg-hero .copy{top:auto;bottom:clamp(96px,13vh,150px);transform:none;max-width:860px}
.pg-hero .head{font-size:100px;line-height:.92;letter-spacing:0}
.pg-hero .blurb{max-width:520px;font-size:18px;margin-top:22px}
.pg-hero .bg{animation:heroImg 2.4s cubic-bezier(.16,1,.3,1) both}
.pg-hero .copy{animation:heroCopy 1.4s cubic-bezier(.16,1,.3,1) .35s both}
.bg-lcht{object-position:70% 50%}
.panel .bg-flat,.panel .bg-weld{width:122%;left:0;right:auto}
.short{height:auto !important;min-height:0;padding:200px 60px 110px}
.short .copy{position:static;transform:none;max-width:880px;animation:heroCopy 1.4s cubic-bezier(.16,1,.3,1) .2s both}

.blk{position:relative;background:#000;color:#f0f0fa;padding:140px 60px}
.blk+.blk{padding-top:40px}
.rule-top{border-top:1px solid rgba(240,240,250,.16)}
.h2{margin:0;font-weight:700;text-transform:uppercase;font-size:48px;line-height:1.04;letter-spacing:.02em;max-width:900px;text-wrap:balance}
.lede{margin:20px 0 0;max-width:560px;font-size:17px;line-height:1.6;color:#c9c9d4}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px;margin:0;padding:0;list-style:none}
.stats li{display:flex;flex-direction:column;gap:12px}
.num{font-size:104px;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.num small{font-size:28px;letter-spacing:.06em;margin-left:10px;text-transform:uppercase}
.num small.pre{margin:0 10px 0 0}
.lab{font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:#c9c9d4}
.stats+.lede{margin-top:88px}

.spec{position:relative;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:center;gap:60px;background:#000;color:#f0f0fa;padding:120px 60px}
.spec.flip{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.spec.flip .sc{order:2}
.sc{max-width:540px}
.kick{margin:0 0 6px;font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:#c9c9d4}
.tabs{display:flex;flex-wrap:wrap;gap:6px 30px;margin:28px 0 4px;padding:0;list-style:none}
.tab{position:relative;min-height:44px;padding:0;border:0;background:none;color:#9a9aa6;cursor:pointer;font:400 15px/1 'D-DIN',Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;transition:color .25s}
.tab:hover{color:#f0f0fa}
.tab::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:2px;background:#f0f0fa;transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.16,1,.3,1)}
.tab.on{color:#f0f0fa}.tab.on::after{transform:scaleX(1)}
.sc p{margin:20px 0 0;font-size:16px;line-height:1.65;color:#c9c9d4}
.tbl{width:100%;margin-top:34px;border-collapse:collapse;font-size:16px}
.tbl th,.tbl td{padding:18px 0;border-bottom:1px solid rgba(240,240,250,.22);vertical-align:top}
.tbl tr:first-child th,.tbl tr:first-child td{border-top:1px solid rgba(240,240,250,.22)}
.tbl th{text-align:left;font-weight:400;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#c9c9d4;padding-right:24px}
.tbl td{text-align:right;font-variant-numeric:tabular-nums}
.tbl.one td{text-align:left}
.fig{display:flex;align-items:center;justify-content:center;min-height:520px}
.fig img{display:block;width:100%;max-width:820px;height:auto}
.fig>img{filter:brightness(1.5) contrast(1.1)}
.fig [data-hairline]{max-width:820px;--hl-plate:#000 !important;--hl-edge:#ededf6 !important;--hl-mid:#a4a4b0 !important;--hl-lo:#5a5a64 !important}
.fig>svg{width:min(100%,560px)}
.fig svg{display:block;height:auto}
.pairs{display:grid;gap:24px;width:100%;max-width:720px}
.pairs figure{margin:0}
.pairs figcaption{display:flex;justify-content:space-between;gap:16px;margin-top:10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#c9c9d4}
.pairs figcaption b{font-weight:700;color:#f0f0fa}
.note{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#9a9aa6;margin-top:6px}
.grades{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.grades span{font-size:120px;line-height:1;letter-spacing:-.01em}
.grades em{font-style:normal;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:#9a9aa6;margin-top:18px}

.spec.three{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,.9fr);gap:48px;align-items:center}
.surf{margin:0}
.surf img{display:block;width:100%;height:auto}
.surf figcaption{margin-top:14px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#c9c9d4}
.surf figcaption b{font-weight:700;color:#f0f0fa}
.surf figcaption span{display:block;margin-top:6px;text-transform:none;letter-spacing:.01em;font-size:15px;line-height:1.5}
.spec.three .sc .note{margin-top:22px;font-size:12px;line-height:1.5;letter-spacing:.1em;color:#9a9aa6}
.nw{white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:56px 40px;margin:64px 0 0;padding:0;list-style:none}
.tiles li{border-top:1px solid rgba(240,240,250,.22);padding-top:24px}
.tiles h3{margin:0;font-size:20px;line-height:1.2;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tiles p{margin:12px 0 0;font-size:16px;line-height:1.6;color:#c9c9d4;max-width:400px}

.statement{margin:0;max-width:1080px;font-size:44px;line-height:1.22;font-weight:400;letter-spacing:0}
.statement+.lede{margin-top:36px;max-width:640px;font-size:18px}

.posts{margin:56px 0 0;padding:0;list-style:none;border-top:1px solid rgba(240,240,250,.22)}
.posts li{display:grid;grid-template-columns:200px minmax(0,1fr) 160px;gap:40px;padding:34px 0;border-bottom:1px solid rgba(240,240,250,.22)}
.posts .cat,.posts .when{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#c9c9d4;padding-top:6px}
.posts .when{text-align:right;color:#9a9aa6}
.posts h3{margin:0;font-size:26px;line-height:1.15;font-weight:700;text-transform:uppercase;letter-spacing:.02em;max-width:760px}
.posts p{margin:12px 0 0;font-size:16px;line-height:1.6;color:#c9c9d4;max-width:680px}
.posts .feat h3{font-size:40px}

.cta{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:32px 60px;background:#000;color:#f0f0fa;padding:120px 60px;border-top:1px solid rgba(240,240,250,.16)}
.cta .sx-btn{margin-top:0}

.form{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:760px}
.form .wide{grid-column:1 / -1}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.field input,.field select,.field textarea{width:100%;min-height:56px;padding:16px 18px;border:1px solid rgba(240,240,250,.3);border-radius:0;background:#000;color:#f0f0fa;font:400 16px/1.4 'D-DIN',Arial,sans-serif;letter-spacing:.02em;transition:border-color .25s}
.field textarea{min-height:150px;resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:#9a9aa6;opacity:1}
.field select{appearance:none;-webkit-appearance:none;cursor:pointer}
.field select:has(option[value=""]:checked){color:#9a9aa6}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#f0f0fa}
.form .sx-btn{background:none;cursor:pointer;font-family:inherit}
.c-head{font-size:72px;line-height:.95}
.hint{margin:4px 0 0;font-size:14px;line-height:1.5;color:#9a9aa6}
.sent{margin:0;font-size:16px;line-height:1.6;color:#f0f0fa}
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:60px;align-items:start}
.direct{margin-top:40px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#c9c9d4}
.direct a{display:inline-flex;min-height:44px;align-items:center;margin-top:6px;font-size:20px;letter-spacing:.02em;text-transform:none;color:#f0f0fa}

@media (max-width: 1100px){
.spec,.spec.flip,.split{grid-template-columns:1fr}
.spec.flip .sc{order:0}
.spec.three{grid-template-columns:1fr 1fr}
.spec.three .sc{grid-column:1 / -1;order:-1}
.fig{min-height:0}
.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
.num{font-size:80px}
}
@media (max-width: 760px){
.pg-hero .head{font-size:52px}
.pg-hero .blurb{font-size:16px}
.short{padding:140px 24px 72px}
.blk,.spec,.cta{padding:88px 24px}
.blk+.blk{padding-top:24px}
.h2{font-size:34px}
.stats,.tiles{grid-template-columns:1fr;gap:36px}
.spec.three{grid-template-columns:1fr}
.num{font-size:72px}
.stats+.lede{margin-top:56px}
.grades span{font-size:72px}
.statement{font-size:28px}
.posts li{grid-template-columns:1fr;gap:10px}
.posts .when{text-align:left;padding-top:0}
.posts .feat h3,.posts h3{font-size:24px}
.form{grid-template-columns:1fr}
.c-head{font-size:44px}
}
@media (prefers-reduced-motion: reduce){
.pg-hero .bg,.pg-hero .copy,.short .copy{animation:none}
.tab::after{transition:none}
}

.st-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:32px 60px}
.st-top .lede a,.st-none a{color:#f0f0fa;text-underline-offset:4px}
.st-search{position:relative;display:flex;align-items:center;gap:12px;width:min(100%,460px);border-bottom:1px solid rgba(240,240,250,.4);color:#c9c9d4;transition:border-color .25s}
.st-search:focus-within{border-color:#f0f0fa}
.st-search input{flex:1;min-width:0;min-height:56px;border:0;background:none;color:#f0f0fa;font:400 17px/1.3 'D-DIN',Arial,sans-serif;letter-spacing:.02em;outline:none}
.st-search input::placeholder{color:#9a9aa6;opacity:1}
.st-count{margin:48px 0 14px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#c9c9d4}
.st-wrap{max-height:640px;overflow-y:auto;border-top:1px solid rgba(240,240,250,.22);border-bottom:1px solid rgba(240,240,250,.22);overscroll-behavior:contain;scrollbar-color:#3a3a42 transparent}
.st-wrap:focus-visible{outline:2px solid #24a8f2;outline-offset:2px}
.st-head{position:sticky;top:0;z-index:2;background:#000}
.st-body{display:flex;flex-direction:column}
.tr{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));align-items:center;border-bottom:1px solid rgba(240,240,250,.12)}
.st-head .tr{border-bottom:1px solid rgba(240,240,250,.3)}
.tr.gone{display:none}
.st-body .tr:hover{background:#0d0d10}
.th{display:flex}
.th:not(.th-gauge){justify-content:flex-end}
.sb{display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:0 18px;border:0;background:none;cursor:pointer;color:#9a9aa6;font:400 13px/1 'D-DIN',Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;transition:color .2s}
.th-gauge .sb{padding-left:0}
.sb:hover,.sb.on{color:#f0f0fa}
.sb .u{text-transform:none;letter-spacing:.04em;color:#6f6f7a}
.sarr path{opacity:.35;transition:opacity .2s}
.sb.asc .up,.sb.desc .dn{opacity:1}
.td{padding:16px 18px;font-size:17px;text-align:right;font-variant-numeric:tabular-nums;color:#e4e4ee}
.td-gauge{padding-left:0;text-align:left;font-weight:700;letter-spacing:.04em;color:#f0f0fa}
.st-none{margin:0;padding:28px 0;font-size:16px;color:#c9c9d4}
.st-note{margin-top:16px}
@media (max-width: 760px){

.st-wrap{max-height:70vh}

<script>
class Component extends DCLogic {
  componentDidMount() {
    this._y = window.scrollY || 0;
    this._size = () => {
      // On the canvas an artboard is as tall as the whole page, so a viewport-high panel would fill it: fall back to a laptop screen.
      const h = window.innerHeight;
      const secH = h > 1300 ? '900px' : Math.max(h, 620) + 'px';
      if (secH !== (this.state && this.state.secH)) this.setState({ secH });
      this._tone();
    };
    this._tone = () => {
      const root = this._root || document;
      const panels = root.querySelectorAll('[data-tone]');
      let light = false;
      panels.forEach((p) => { const r = p.getBoundingClientRect(); if (r.top <= 42 && r.bottom > 42) light = p.getAttribute('data-tone') === 'light'; });
      if (light !== !!(this.state && this.state.light)) this.setState({ light });
    };
    this._scroll = () => {
      const y = window.scrollY || 0, dy = y - this._y;
      this._y = y;
      let hide = this.state && this.state.hide;
      if (y < 120) hide = false; else if (dy > 6) hide = true; else if (dy < -6) hide = false;
      if (this.state && this.state.menuOpen) hide = false;
      if (hide !== (this.state && this.state.hide)) this.setState({ hide, ddOpen: hide ? false : this.state.ddOpen });
      this._tone();
    };
    this._key = (e) => { if (e.key === 'Escape' && this.state && (this.state.menuOpen || this.state.ddOpen)) this.setState({ menuOpen: false, ddOpen: false }); };
    this._docClick = (e) => { if (this.state && this.state.ddOpen && !(e.target.closest && e.target.closest('.has-dd'))) this.setState({ ddOpen: false }); };
    window.addEventListener('resize', this._size);
    window.addEventListener('scroll', this._scroll, { passive: true });
    document.addEventListener('keydown', this._key);
    document.addEventListener('click', this._docClick);
    this._size();
    if (this._mountX) this._mountX();
  }
  componentWillUnmount() {
    if (this._unmountX) this._unmountX();
    window.removeEventListener('resize', this._size);
    window.removeEventListener('scroll', this._scroll);
    document.removeEventListener('keydown', this._key);
    document.removeEventListener('click', this._docClick);
  }
  
  renderVals() {
    const s = this.state || {};
    let bar = 'bar';
    if (s.hide) bar += ' hide';
    if (s.light) bar += ' light';
    return {
      secH: s.secH || '900px',
      barCls: bar,
      ddCls: s.ddOpen ? 'has-dd dd-open' : 'has-dd',
      ddExp: s.ddOpen ? 'true' : 'false',
      menuOpen: !!s.menuOpen,
      matOn0: (s.mat || 0) === 0, matSel0: (s.mat || 0) === 0 ? 'true' : 'false', matCls0: (s.mat || 0) === 0 ? 'tab on' : 'tab', matGo0: () => this.setState({ mat: 0 }),
      matOn1: (s.mat || 0) === 1, matSel1: (s.mat || 0) === 1 ? 'true' : 'false', matCls1: (s.mat || 0) === 1 ? 'tab on' : 'tab', matGo1: () => this.setState({ mat: 1 }),
      matOn2: (s.mat || 0) === 2, matSel2: (s.mat || 0) === 2 ? 'true' : 'false', matCls2: (s.mat || 0) === 2 ? 'tab on' : 'tab', matGo2: () => this.setState({ mat: 2 }),
      menuExp: s.menuOpen ? 'true' : 'false',
      toggleDd: (e) => { if (e) e.stopPropagation(); this.setState({ ddOpen: !(this.state && this.state.ddOpen) }); },
      openMenu: () => this.setState({ menuOpen: true, hide: false }),
      closeMenu: () => this.setState({ menuOpen: false }),
    };
  }
}
DCLite.mount(document.getElementById('page'), Component, {}, document.getElementById('app'));
</script>
