<style>
@font-face{font-family:'D-DIN';src:url('assets/fonts/D-DIN-PRO-400.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'D-DIN';src:url('assets/fonts/D-DIN-PRO-700.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
body{margin:0;background:#000}
a{color:#f0f0fa}a:hover{color:#ffffff}
::selection{background:#24a8f2;color:#000}
.b-root{font-family:'D-DIN',Arial,Verdana,sans-serif;color:#f0f0fa;background:#000;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.b-root *{box-sizing:border-box}
.b-root a:focus-visible,.b-root button:focus-visible{outline:2px solid #24a8f2;outline-offset:3px}
.skip{position:absolute;left:-9999px;top:12px;z-index:100;background:#f0f0fa;color:#000;padding:12px 16px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.skip:focus{left:60px}
.skip:hover{color:#000}

/* bar */
.bar{position:fixed;top:0;left:0;right:0;z-index:50;height:84px;display:flex;align-items:center;gap:56px;padding:0 60px;color:#f0f0fa;
  background:linear-gradient(rgba(0,0,0,.6) 0%,rgba(0,0,0,0) 100%);transition:transform .5s cubic-bezier(.16,1,.3,1),color .35s ease,background .35s ease}
.bar.hide{transform:translateY(-100%)}
.bar.light{color:#0a0a0b;background:linear-gradient(rgba(255,255,255,.7) 0%,rgba(255,255,255,0) 100%)}
.home{display:flex;align-items:center;min-height:44px;color:inherit;flex:none}
.home:hover{color:inherit}
.logo{display:block;height:19px;width:auto}
.links{display:flex;align-items:center;gap:30px;margin:0;padding:0;list-style:none}
.links>li{position:relative}
.nl{position:relative;display:flex;align-items:center;gap:7px;min-height:44px;padding:0;border:0;background:none;cursor:pointer;color:inherit;text-decoration:none;
  font:700 13px/1 'D-DIN',Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.bar a.nl:hover,.bar button.nl:hover{color:inherit}
.nl::after{content:"";position:absolute;left:0;right:0;bottom:9px;height:2px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.16,1,.3,1)}
.nl:hover::after,.nl:focus-visible::after,.dd-open>.nl::after{transform:scaleX(1)}
.chev{transition:transform .3s ease}
.dd-open .chev,.has-dd:hover .chev{transform:rotate(180deg)}
.dd{position:absolute;top:100%;left:-20px;min-width:230px;margin:0;padding:8px 0;list-style:none;background:#000;border:1px solid rgba(240,240,250,.14);
  opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .25s ease,transform .35s cubic-bezier(.16,1,.3,1),visibility 0s .35s}
.has-dd:hover .dd,.has-dd:focus-within .dd,.dd-open .dd{opacity:1;visibility:visible;transform:none;transition:opacity .25s ease,transform .35s cubic-bezier(.16,1,.3,1)}
.dd a{display:flex;align-items:center;min-height:44px;padding:0 20px;color:#f0f0fa;text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.dd a:hover{background:#f0f0fa;color:#000}
.menu-btn{display:none;margin-left:auto;width:44px;height:44px;align-items:center;justify-content:center;border:0;background:none;color:inherit;cursor:pointer;padding:0}

/* drawer */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);border:0;padding:0;cursor:pointer;width:100%}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:61;width:min(400px,100%);background:#000;color:#f0f0fa;padding:20px 40px 40px;overflow-y:auto;animation:dIn .45s cubic-bezier(.16,1,.3,1) both}
@keyframes dIn{from{transform:translateX(100%)}to{transform:none}}
.drawer .x{display:flex;margin:0 -10px 24px auto;width:44px;height:44px;align-items:center;justify-content:center;border:0;background:none;color:inherit;cursor:pointer}
.drawer ul{list-style:none;margin:0;padding:0}
.drawer li a{display:flex;align-items:center;min-height:52px;border-bottom:1px solid rgba(240,240,250,.14);color:#f0f0fa;text-decoration:none;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.drawer li.sub a{padding-left:18px;font-size:13px;min-height:46px;color:#c9c9d4}
.drawer .grp{margin-top:28px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#9a9aa6;padding-bottom:8px;border-bottom:1px solid rgba(240,240,250,.14)}

/* panels */
.panel{position:relative;overflow:hidden;min-height:620px;background:#000}
.panel .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* the photographs are shot centred; widening them pushes the subject right, clear of the copy */
.panel .bg-pattern,.panel .bg-proto{width:122%;left:0;right:auto}
.panel .bg-facility{width:130%;left:0;right:auto}
.hero .bg{left:auto;right:0;width:auto;aspect-ratio:1/1;max-width:none}
.shade{position:absolute;inset:0;pointer-events:none}
.dark .shade{background:linear-gradient(90deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,.5) 28%,rgba(0,0,0,0) 56%),linear-gradient(0deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 30%)}
.light{background:#f5f7fb;color:#0a0a0b}
.light .shade{background:linear-gradient(90deg,rgba(245,247,251,.92) 0%,rgba(245,247,251,.75) 28%,rgba(245,247,251,0) 52%)}
.copy{position:absolute;left:60px;top:50%;transform:translateY(-50%);max-width:620px;z-index:2}
.hero .copy{top:auto;bottom:clamp(96px,14vh,150px);transform:none;max-width:780px}
.head{margin:0;font-weight:700;text-transform:uppercase;font-size:48px;line-height:1.04;letter-spacing:.02em;text-wrap:balance}
.hero .head{font-size:60px;line-height:.98;letter-spacing:.01em}
.blurb{margin:18px 0 0;max-width:440px;font-size:17px;line-height:1.5;letter-spacing:.01em;color:rgba(240,240,250,.86)}
.light .blurb{color:#2b2b31}
.sx-btn{display:inline-flex;align-items:center;gap:14px;height:50px;margin-top:30px;padding:0 22px;border:1px solid rgba(240,240,250,.35);color:#f0f0fa;text-decoration:none;
  font-size:14px;letter-spacing:.08em;text-transform:uppercase;transition:background .35s cubic-bezier(.16,1,.3,1),color .35s,border-color .35s}
.sx-btn .arr{transition:transform .45s cubic-bezier(.16,1,.3,1)}
.sx-btn:hover{background:#f0f0fa;border-color:#f0f0fa;color:#000}
.sx-btn:hover .arr{transform:translateX(4px)}
.light .sx-btn{border-color:rgba(10,10,11,.4);color:#0a0a0b}
.light .sx-btn:hover{background:#0a0a0b;border-color:#0a0a0b;color:#f5f7fb}

/* the one entrance: the first frame settles into place */
.hero .bg{animation:heroImg 2.4s cubic-bezier(.16,1,.3,1) both}
.hero .copy{animation:heroCopy 1.4s cubic-bezier(.16,1,.3,1) .35s both}

.foot a{color:#f0f0fa;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}

@media (prefers-reduced-motion: reduce){

<script>
class Component extends DCLogic {
  componentDidMount() {
    this._y = window.scrollY || 0;
    this._size = () => {
      // On the canvas an artboard is as tall as the whole page, so a viewport-high panel would fill it: fall back to a laptop screen.
      const h = window.innerHeight;
      const secH = h > 1300 ? '900px' : Math.max(h, 620) + 'px';
      if (secH !== (this.state && this.state.secH)) this.setState({ secH });
      this._tone();
    };
    this._tone = () => {
      const root = this._root || document;
      const panels = root.querySelectorAll('[data-tone]');
      let light = false;
      panels.forEach((p) => { const r = p.getBoundingClientRect(); if (r.top <= 42 && r.bottom > 42) light = p.getAttribute('data-tone') === 'light'; });
      if (light !== !!(this.state && this.state.light)) this.setState({ light });
    };
    this._scroll = () => {
      const y = window.scrollY || 0, dy = y - this._y;
      this._y = y;
      let hide = this.state && this.state.hide;
      if (y < 120) hide = false; else if (dy > 6) hide = true; else if (dy < -6) hide = false;
      if (this.state && this.state.menuOpen) hide = false;
      if (hide !== (this.state && this.state.hide)) this.setState({ hide, ddOpen: hide ? false : this.state.ddOpen });
      this._tone();
    };
    this._key = (e) => { if (e.key === 'Escape' && this.state && (this.state.menuOpen || this.state.ddOpen)) this.setState({ menuOpen: false, ddOpen: false }); };
    this._docClick = (e) => { if (this.state && this.state.ddOpen && !(e.target.closest && e.target.closest('.has-dd'))) this.setState({ ddOpen: false }); };
    window.addEventListener('resize', this._size);
    window.addEventListener('scroll', this._scroll, { passive: true });
    document.addEventListener('keydown', this._key);
    document.addEventListener('click', this._docClick);
    this._size();
    if (this._mountX) this._mountX();
  }
  componentWillUnmount() {
    if (this._unmountX) this._unmountX();
    window.removeEventListener('resize', this._size);
    window.removeEventListener('scroll', this._scroll);
    document.removeEventListener('keydown', this._key);
    document.removeEventListener('click', this._docClick);
  }
  
  renderVals() {
    const s = this.state || {};
    let bar = 'bar';
    if (s.hide) bar += ' hide';
    if (s.light) bar += ' light';
    return {
      secH: s.secH || '900px',
      barCls: bar,
      ddCls: s.ddOpen ? 'has-dd dd-open' : 'has-dd',
      ddExp: s.ddOpen ? 'true' : 'false',
      menuOpen: !!s.menuOpen,
      
      menuExp: s.menuOpen ? 'true' : 'false',
      toggleDd: (e) => { if (e) e.stopPropagation(); this.setState({ ddOpen: !(this.state && this.state.ddOpen) }); },
      openMenu: () => this.setState({ menuOpen: true, hide: false }),
      closeMenu: () => this.setState({ menuOpen: false }),
    };
  }
}
DCLite.mount(document.getElementById('page'), Component, {}, document.getElementById('app'));
</script>
</body>
</html>
