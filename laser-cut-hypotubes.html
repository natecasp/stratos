.fg{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:64px;align-items:center}
.fg-copy{display:flex;flex-direction:column;gap:20px}
.fg-copy h2{margin:0;font-size:42px;line-height:1.04;font-weight:700;text-transform:uppercase}
.fg-copy p{margin:0;font-size:16px;line-height:1.65;color:#a6a6ad;max-width:52ch}
.fg-fig{border:1px solid #1d1d22;border-radius:6px;background:#0a0a0b;padding:28px 28px 0}
.fg-key{display:flex;flex-wrap:wrap;gap:10px 28px;padding:14px 4px 16px;border-top:1px solid #1d1d22;margin-top:4px;font-size:12px;color:#8a8a92}
.fg-key span{display:inline-flex;align-items:center;gap:10px}
.fg-key i{display:inline-block;width:18px;height:0;border-top:1.5px solid #5b5d64}
.fg-key i.b{border-top-color:#24a8f2}
.fg-cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin-top:56px;border-top:1px solid #25252b}
.fg-cmp>div{padding:28px 32px 8px 0}
.fg-cmp>div+div{padding-left:32px;border-left:1px solid #25252b}
.fg-cmp h3{margin:0 0 14px;font-size:17px;font-weight:700;text-transform:uppercase}
.fg-cmp ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.fg-cmp li{font-size:15px;line-height:1.55;color:#a6a6ad;padding-left:22px;position:relative}
.fg-cmp li::before{content:"";position:absolute;left:0;top:.7em;width:10px;height:2px;background:#4a4c53}
.fg-cmp .us h3{color:#ffffff}
.fg-cmp .us li{color:#d4d4d8}
.fg-cmp .us li::before{background:#24a8f2}
@media (max-width:900px){.fg{grid-template-columns:minmax(0,1fr);gap:40px}.fg-copy h2{font-size:32px}.fg-cmp{grid-template-columns:minmax(0,1fr)}.fg-cmp>div{padding:24px 0 8px}.fg-cmp>div+div{padding-left:0;border-left:0;border-top:1px solid #25252b}}

.pat3{display:flex;flex-direction:column;gap:12px;padding:28px 0 32px}
.pat3-fig{position:relative;aspect-ratio:1/1;border:1px solid #1d1d22;border-radius:6px;background:radial-gradient(120% 90% at 50% 38%,#16181d 0%,#0d0e11 62%,#0a0a0b 100%);overflow:hidden;margin-bottom:12px}
.pat3-fig canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pat3 h3{margin:0;font-size:19px;font-weight:700;text-transform:uppercase}
.pat3 p{margin:0;font-size:15px;line-height:1.6;color:#a6a6ad;max-width:36ch}
@media (max-width:640px){.g3p{grid-template-columns:minmax(0,1fr)!important;gap:8px!important}.pat3{padding:20px 0 24px}.pat3-fig{max-width:360px}}

<body>
<div id="app"></div>
<template id="page">
<div ref="{{setRoot}}" style="position: relative; background: #0a0a0b; color: #f4f4f3; font-family: 'Inter', system-ui, sans-serif; overflow: hidden">

<div aria-hidden="true" style="position: absolute; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(1200px 700px at 78% 6%, rgba(36,168,242,0.10), transparent 60%), radial-gradient(900px 600px at 10% 46%, rgba(36,168,242,0.05), transparent 60%)"></div>

<svg aria-hidden="true" width="{{svgW}}" height="{{svgH}}" style="position: absolute; left: 0; top: 0; z-index: 1; pointer-events: none; overflow: visible">

<h2 class="disp">No feed gaps.</h2>
<p>What sets a Stratos hypotube apart is what isn’t in it: feed gaps.</p>
<p>Conventional cutting grips the tube, cuts a stroke, lets go and grips again, over and over. Every re-grip is a chance for misalignment: cuts land closer together than designed, the pattern drifts, and the flexibility of the finished part changes along its length.</p>
<p>Stratos’ proprietary laser cutting technology eliminates feed gaps, so the pattern runs as one seamless cut from the first slot to the last.</p>

<section style="position: relative; padding: 96px 0">
<div class="wrap">
<div style="display: flex; flex-direction: column; gap: 16px; max-width: 720px; margin-bottom: 48px"><h2 class="disp h2" style="margin: 0; font-size: 42px; line-height: 1.04; font-weight: 700; text-transform: uppercase">Why laser cut hypotubes.</h2></div>
<div data-cut="grid" data-label="Benefits" class="g3"><div style="padding: 32px 30px 36px; display: flex; flex-direction: column; gap: 12px"><h3 class="disp" style="margin: 0; font-size: 19px; font-weight: 700; text-transform: uppercase">Flex where needed</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #a6a6ad">Controlled flexibility through tortuous anatomy, with support where it counts.</p></div><div style="padding: 32px 30px 36px; display: flex; flex-direction: column; gap: 12px"><h3 class="disp" style="margin: 0; font-size: 19px; font-weight: 700; text-transform: uppercase">Torqueability</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #a6a6ad">Near 1:1 torque transmission from proximal end to distal tip.</p></div><div style="padding: 32px 30px 36px; display: flex; flex-direction: column; gap: 12px"><h3 class="disp" style="margin: 0; font-size: 19px; font-weight: 700; text-transform: uppercase">Kink resistance</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #a6a6ad">Cut patterns spread bending stress and keep the lumen open.</p></div><div style="padding: 32px 30px 36px; display: flex; flex-direction: column; gap: 12px"><h3 class="disp" style="margin: 0; font-size: 19px; font-weight: 700; text-transform: uppercase">Pushability</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #a6a6ad">Variable stiffness balances push force with distal flex.</p></div><div style="padding: 32px 30px 36px; display: flex; flex-direction: column; gap: 12px"><h3 class="disp" style="margin: 0; font-size: 19px; font-weight: 700; text-transform: uppercase">Accurate cuts</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #a6a6ad">Micron-level accuracy, repeatable from prototype to production.</p></div><div style="padding: 32px 30px 36px; display: flex; flex-direction: column; gap: 12px"><h3 class="disp" style="margin: 0; font-size: 19px; font-weight: 700; text-transform: uppercase">Any pattern</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #a6a6ad">Geometry tuned to your flex, stiffness and torque targets.</p></div></div>
</div>
</section>
<section style="position: relative; padding: 96px 0">
<div class="wrap">
<div style="display: flex; flex-direction: column; gap: 16px; max-width: 720px; margin-bottom: 48px"><h2 class="disp h2" style="margin: 0; font-size: 42px; line-height: 1.04; font-weight: 700; text-transform: uppercase">Many ways to flex.</h2><p style="margin: 0; font-size: 17px; line-height: 1.55; color: #a6a6ad">The cut pattern is the design: each geometry tunes flexibility, torque and fatigue life in its own way.</p></div>
<div data-cut="cards" data-label="Patterns" class="g3p"><div class="pat3"><div class="pat3-fig" role="img" aria-label="A turning hypotube cut with a hybrid dogbone pattern"><canvas data-tube3d="0" aria-hidden="true"></canvas></div><h3 class="disp">Hybrid dogbone</h3><p>Dog-bone ends spread stress to protect fatigue life at tight bends.</p></div><div class="pat3"><div class="pat3-fig" role="img" aria-label="A turning hypotube cut with an interrupted spiral pattern"><canvas data-tube3d="1" aria-hidden="true"></canvas></div><h3 class="disp">Interrupted spiral</h3><p>Staggered cuts spiral the struts for smooth, omnidirectional bending.</p></div><div class="pat3"><div class="pat3-fig" role="img" aria-label="A turning hypotube cut with a 1P1D beam and lens pattern"><canvas data-tube3d="2" aria-hidden="true"></canvas></div><h3 class="disp">1P1D</h3><p>Alternating beam and lens cuts tune the proximal-to-distal stiffness profile.</p></div></div>
</div>
</section>
