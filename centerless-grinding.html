<h1 class="disp hero-h1" style="margin: 0; font-size: 66px; line-height: 1; font-weight: 700"><span style="color: {{accent}}">Centerless</span><br>grinding.</h1>
<p style="margin: 0; max-width: 460px; font-size: 18px; line-height: 1.55; color: #a6a6ad">In-house centerless grinding for total control of your outer diameter.</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px"><a href="mailto:info@stratoslaser.com" class="btn" style="background: #ffffff; color: #0a0a0b">Get your free quote →</a><a href="capabilities.html" class="btn" style="border: 1px solid #3a3a42; color: #f4f4f3">All capabilities</a></div>
<div class="g4" style="margin-top: 16px; gap: 22px 28px; grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 460px"><div style="display: flex; flex-direction: column; gap: 6px"><div class="disp" style="font-size: 24px; font-weight: 700">.010–1 in</div><div class="mono" style="font-size: 11px; color: #8a8a92">Outer diameter</div></div><div style="display: flex; flex-direction: column; gap: 6px"><div class="disp" style="font-size: 24px; font-weight: 700">≤ 10 ft</div><div class="mono" style="font-size: 11px; color: #8a8a92">Length</div></div><div style="display: flex; flex-direction: column; gap: 6px"><div class="disp" style="font-size: 24px; font-weight: 700">±.0005 in</div><div class="mono" style="font-size: 11px; color: #8a8a92">Typical tolerance</div></div><div style="display: flex; flex-direction: column; gap: 6px"><div class="disp" style="font-size: 24px; font-weight: 700">2 Ra</div><div class="mono" style="font-size: 11px; color: #8a8a92">Surface finish</div></div></div>
</div>
<div data-cut="origin" data-label="Start" class="hv" style="position: relative; height: 480px; border-radius: 6px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #0a0a0b; border: 1px solid #1d1d22"><div style="width: 100%; max-width: 560px"><img src="assets/fig-grinding.svg" alt="Line drawing of a tube fed between a grinding wheel and a regulating wheel" width="400" height="320" loading="lazy" decoding="async" style="display: block; width: 100%; height: auto"></div></div>
</div></div>

<section style="position: relative; padding: 96px 0">
<div class="wrap">
<div class="g2" style="align-items: start">
<div style="display: flex; flex-direction: column; gap: 16px; max-width: 720px; margin-bottom: 0px"><h2 class="disp h2" style="margin: 0; font-size: 42px; line-height: 1.04; font-weight: 700; text-transform: uppercase">No spindle. No fixture. True to axis.</h2><p style="margin: 0; font-size: 17px; line-height: 1.55; color: #a6a6ad">The tube rides between a grinding wheel and a regulating wheel, so material is removed continuously and uniformly along its full length — with no clamping errors. Works with stainless steel, nitinol, cobalt-chromium and other specialty alloys.</p></div>
<div data-cut="rows" data-label="Benefits"><div style="display: flex; gap: 20px; align-items: baseline; padding: 20px 0"><span style="font-size: 16px; line-height: 1.5">Tight OD tolerances for consistent device performance</span></div><div style="display: flex; gap: 20px; align-items: baseline; padding: 20px 0"><span style="font-size: 16px; line-height: 1.5">Smooth finishes that improve assembly and coating</span></div><div style="display: flex; gap: 20px; align-items: baseline; padding: 20px 0"><span style="font-size: 16px; line-height: 1.5">Reduced profiles for minimally invasive applications</span></div><div style="display: flex; gap: 20px; align-items: baseline; padding: 20px 0"><span style="font-size: 16px; line-height: 1.5">Excellent concentricity and repeatability</span></div><div style="display: flex; gap: 20px; align-items: baseline; padding: 20px 0"><span style="font-size: 16px; line-height: 1.5">One scalable process from prototype to production</span></div></div>
</div>
</div>
</section>
<section style="position: relative; padding: 96px 0">
<div class="wrap">
<div style="display: flex; flex-direction: column; gap: 16px; max-width: 720px; margin-bottom: 48px"><h2 class="disp h2" style="margin: 0; font-size: 42px; line-height: 1.04; font-weight: 700; text-transform: uppercase">Metals cut to spec.</h2><p style="margin: 0; font-size: 17px; line-height: 1.55; color: #a6a6ad">A wide range of medical-grade metals, processed on custom-built machinery. Don’t see the material you need? Let us know.</p></div>
<div data-cut="cards" data-label="Materials" class="g3" style="gap: 28px"><div style="padding: 32px 28px; display: flex; flex-direction: column; gap: 12px"><h3 class="disp" style="margin: 0; font-size: 21px; font-weight: 700; text-transform: uppercase; line-height: 1.08">Stainless<br>steel</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #a6a6ad">Corrosion resistance, strength and biocompatibility for catheter shafts, implants and precision components.</p><div class="mono" style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px; margin-top: 4px"><span class="chip">304</span><span class="chip">316</span><span class="chip">17-7</span></div></div><div style="padding: 32px 28px; display: flex; flex-direction: column; gap: 12px"><h3 class="disp" style="margin: 0; font-size: 21px; font-weight: 700; text-transform: uppercase; line-height: 1.08">Nitinol<br>&nbsp;</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #a6a6ad">Shape-memory and superelastic behavior for minimally invasive devices needing flexibility and recovery.</p><div class="mono" style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px; margin-top: 4px"><span class="chip">Superelastic</span></div></div><div style="padding: 32px 28px; display: flex; flex-direction: column; gap: 12px"><h3 class="disp" style="margin: 0; font-size: 21px; font-weight: 700; text-transform: uppercase; line-height: 1.08">Cobalt-<br>chromium</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #a6a6ad">Exceptional strength, fatigue resistance and durability for implantable and structural components.</p><div class="mono" style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px; margin-top: 4px"><span class="chip">L605</span><span class="chip">MP35N</span></div></div></div>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 16px; margin-top: 48px"><div class="disp" style="font-size: 21px; font-weight: 700; text-transform: uppercase">We stock millions of feet of material.</div><p style="margin: 0; max-width: 420px; font-size: 15px; line-height: 1.6; color: #a6a6ad">We move fast, which means keeping the materials you need on hand at all times.</p></div>
</div>
</section>
<section style="position: relative; padding: 96px 0">

<div style="display: flex; flex-direction: column; gap: 16px; max-width: 720px; margin-bottom: 0px"><h2 class="disp h2" style="margin: 0; font-size: 42px; line-height: 1.04; font-weight: 700; text-transform: uppercase">Clean, burr-free parts.</h2></div>
<div style="display: flex; flex-direction: column; gap: 18px; padding-top: 34px">
<p style="margin: 0; font-size: 16px; line-height: 1.65; color: #a6a6ad">All parts undergo our custom cleaning and pickling process to remove surface oxides and burrs for a clean, consistent finish. The process follows ASTM A380 and has passed passivation testing.</p>
