html{scrollbar-color:#3a3a42 #0a0a0b;-webkit-text-size-adjust:100%;text-size-adjust:100%}

.btn{transition:transform 160ms cubic-bezier(.23,1,.32,1),background-color 200ms ease,border-color 200ms ease,color 200ms ease}

.caprow{grid-template-columns:minmax(0,1fr) auto}
.arr{transition:transform 200ms cubic-bezier(.23,1,.32,1),color 200ms ease}
.caprow:hover .arr{color:#8a8a92;transform:none}

.ax .ax-turn,.ax .ax-beam{transform-box:view-box;transform-origin:200px 200px}
.ax .ax-sec{stroke-dasharray:0 1000}
.ax .ax-lines{opacity:0}
.ax-play .ax-sec{animation:axSec 4.2s cubic-bezier(.77,0,.175,1) both}
.ax-play .ax-beam{animation:axBeam 4.2s cubic-bezier(.77,0,.175,1) both}
.ax-play .ax-lines{animation:axLines 4.2s linear both}
.ax-play .ax-turn{animation:axTurn 4.2s cubic-bezier(.77,0,.175,1) both}
@keyframes axSec{0%,4.76%{stroke-dasharray:0 1000}52.4%,100%{stroke-dasharray:241.9 1000}}
@keyframes axBeam{0%,4.76%{transform:rotate(0deg)}52.4%,100%{transform:rotate(90deg)}}
@keyframes axLines{0%{opacity:0}4.76%,52.4%{opacity:1}61.9%,100%{opacity:0}}
@keyframes axTurn{0%,61.9%{transform:rotate(0deg)}90.5%,100%{transform:rotate(-45deg)}}

}

}
